version: "3.3"

services:
  reverse-proxy:
    image: traefik:v3.3
    command: 
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.consul=true" #providers.consul.token|username|password|tlc
      - "--entrypoints.web.address=:80"
      - "--log.level=DEBUG"
    ports:
      - target: 8080
        published: 8080
        mode: host
      - target: 80
        published: 80
        mode: host
      #- "80:80"
      #- "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - web 
    deploy:
      placement:
        constraints:
          - node.role == manager
networks: 
  web:
    external: true